<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>House Price Predictor</title>
    <style>
      body {
        background: #000000;
        min-height: 100vh;
        padding: 40px 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .container {
        max-width: 800px;
      }
      .card {
        background: #1a1a1a;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        padding: 40px;
        border: 1px solid #333;
      }
      .header-title {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        font-weight: bold;
        font-size: 2rem;
        margin-bottom: 10px;
      }
      .subtitle {
        color: #999;
        margin-bottom: 30px;
      }
      label {
        font-weight: 600;
        color: #e0e0e0;
        margin-bottom: 8px;
      }
      .form-control, .form-select {
        background: #0a0a0a;
        border: 2px solid #333;
        border-radius: 8px;
        padding: 12px;
        transition: all 0.3s;
        color: #ffffff;
      }
      .form-control::placeholder {
        color: #666;
      }
      .form-select {
        color: #ffffff;
      }
      .form-select option {
        background: #0a0a0a;
        color: #ffffff;
      }
      .form-control:focus, .form-select:focus {
        background: #1a1a1a;
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        color: #ffffff;
      }
      .btn-predict {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        padding: 15px;
        font-size: 1.1rem;
        font-weight: 600;
        border-radius: 8px;
        width: 100%;
        margin-top: 20px;
        transition: transform 0.2s;
        color: white;
      }
      .btn-predict:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
      }
      .prediction-result {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 10px;
        margin-top: 30px;
        text-align: center;
      }
      .prediction-result h4 {
        margin: 0;
        font-size: 1.3rem;
      }
      .prediction-result .price {
        font-size: 2rem;
        font-weight: bold;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1 class="header-title text-center">Welcome to Bangalore House Price Predictor</h1>
        <p class="subtitle text-center">Want to predict the price of a new House in Bangalore? Try filling the details below:</p>

        <form action="/predict" method="POST">
          <div class="row mb-4">
            <div class="col-md-6">
              <label for="location">Select the Location:</label>
              <select class="form-select" id="location" name="location" required>
                <option value="">Choose location...</option>
                {% for location in locations %}
                <option value="{{ location }}">{{ location }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label for="bhk">Enter BHK:</label>
              <input type="number" class="form-control" id="bhk" name="bhk" placeholder="e.g., 4" min="1" max="10" required>
            </div>
          </div>

          <div class="row mb-4">
            <div class="col-md-6">
              <label for="bath">Enter Number of Bathrooms:</label>
              <input type="number" class="form-control" id="bath" name="bath" placeholder="e.g., 3" min="1" max="10" required>
            </div>
            <div class="col-md-6">
              <label for="total_sqft">Enter Total Square Feet:</label>
              <input type="number" class="form-control" id="total_sqft" name="total_sqft" placeholder="e.g., 2000" min="100" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-predict">Predict Price</button>
        </form>

        {% if prediction %}
        <div class="prediction-result">
          <h4>Prediction:</h4>
          <div class="price">{{ prediction }}</div>
        </div>
        {% endif %}
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
